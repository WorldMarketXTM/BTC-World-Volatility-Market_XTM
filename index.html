<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTC-World-Volatility-Market_XTM - predict</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            background-color: #12161c;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
        }
        .app-card {
            background-color: #1e2329;
            width: 540px; /* Ancho ampliado para mejor distribución */
            padding: 22px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
        }
        .repo-title-top {
            font-size: 0.8em;
            color: #8c62ff;
            font-weight: bold;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }
        .brand-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .brand-logo {
            font-size: 1.6em;
            font-weight: 800;
            color: #8c62ff;
            letter-spacing: -0.5px;
        }
        .market-title {
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btc-icon {
            background: #f0b90b;
            color: #000;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 0.75em;
        }
        .meta-info {
            font-size: 0.85em;
            color: #848e9c;
            margin-bottom: 15px;
            border-bottom: 1px solid #2b313a;
            padding-bottom: 8px;
        }
        /* 4 columnas en el mismo renglón */
        .prices-grid-4 {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 15px;
            background: #12161c;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
        }
        .price-col-title {
            font-size: 0.7em;
            color: #848e9c;
            margin-bottom: 4px;
            text-transform: uppercase;
        }
        .price-col-val {
            font-size: 0.9em;
            font-weight: bold;
            color: #eaeaea;
        }
        .countdown-val {
            font-size: 1em;
            font-weight: bold;
            color: #f6465d;
        }
        /* Gráfica rectangular más grande */
        .chart-box {
            position: relative;
            height: 220px;
            width: 100%;
            margin-bottom: 15px;
            background: #12161c;
            border-radius: 10px;
            padding: 8px;
        }
        /* Botones rectangulares gris claro con letras de color */
        .options-container {
            display: flex;
            gap: 12px;
            margin-bottom: 15px;
        }
        .opt-btn {
            flex: 1;
            background-color: #2b3743; /* Gris más claro */
            border: 1px solid #3c4958;
            border-radius: 10px;
            padding: 14px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .opt-btn .btn-text {
            font-size: 1.2em;
            font-weight: 800;
        }
        .opt-btn .btn-sub {
            font-size: 0.75em;
            margin-top: 2px;
            color: #848e9c;
        }
        .up-btn .btn-text { color: #0ecb81; }
        .down-btn .btn-text { color: #f6465d; }

        @keyframes flash-green {
            0%, 100% { background-color: #2b3743; box-shadow: none; }
            50% { background-color: rgba(14, 203, 129, 0.4); border-color: #0ecb81; box-shadow: 0 0 15px #0ecb81; }
        }
        @keyframes flash-red {
            0%, 100% { background-color: #2b3743; box-shadow: none; }
            50% { background-color: rgba(246, 70, 93, 0.4); border-color: #f6465d; box-shadow: 0 0 15px #f6465d; }
        }
        .alert-up-active { animation: flash-green 0.8s infinite; }
        .alert-down-active { animation: flash-red 0.8s infinite; }

        /* Panel de 3 Algoritmos Proyectivos */
        .predictive-panel {
            background-color: #12161c;
            border: 1px solid #2b313a;
            border-radius: 10px;
            padding: 12px;
            font-size: 0.82em;
        }
        .predictive-header {
            color: #f0b90b;
            font-weight: bold;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }
        .targets-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            text-align: center;
            background: #1e2329;
            padding: 8px;
            border-radius: 6px;
        }
        .target-item span {
            display: block;
            color: #848e9c;
            font-size: 0.75em;
        }
        .target-item strong {
            font-size: 1.05em;
            color: #ffffff;
        }
    </style>
</head>
<body>

<div class="app-card">
    <div class="repo-title-top">BTC-World-Volatility-Market_XTM</div>
    <div class="brand-header">
        <div class="brand-logo">predict</div>
    </div>

    <div class="market-title">
        <span class="btc-icon">₿</span> BTC Up or Down 1h
    </div>

    <div class="meta-info" id="current-date-str">
        Cargando fecha...
    </div>

    <!-- Mismo renglón para los 4 indicadores -->
    <div class="prices-grid-4">
        <div>
            <div class="price-col-title">Precio Inicial</div>
            <div class="price-col-val" id="base-price">...</div>
        </div>
        <div>
            <div class="price-col-title">Precio Actual</div>
            <div class="price-col-val" id="current-price">$0.00</div>
        </div>
        <div>
            <div class="price-col-title">Diferencia</div>
            <div class="price-col-val" id="delta-val">$0.00</div>
        </div>
        <div>
            <div class="price-col-title">Regresiva</div>
            <div class="countdown-val" id="timer">--:--</div>
        </div>
    </div>

    <!-- Gráfica Rectangular Ampliada -->
    <div class="chart-box">
        <canvas id="priceChart"></canvas>
    </div>

    <!-- Botones Rectangulares Estilo Binance -->
    <div class="options-container">
        <div class="opt-btn up-btn" id="btn-up">
            <div class="btn-text">UP</div>
            <div class="btn-sub">Meta: +$375</div>
        </div>
        <div class="opt-btn down-btn" id="btn-down">
            <div class="btn-text">DOWN</div>
            <div class="btn-sub">Meta: -$375</div>
        </div>
    </div>

    <!-- 3 Algoritmos Proyectivos (3s, 5s, 10s) -->
    <div class="predictive-panel">
        <div class="predictive-header">
            <span>🤖 Algoritmos Proyectivos Multi-Horizonte</span>
            <span id="trend-indicator" style="color: #848e9c;">Inercia Estable</span>
        </div>
        <div class="targets-grid">
            <div class="target-item">
                <span>Target (+3s)</span>
                <strong id="target-3s">--</strong>
            </div>
            <div class="target-item">
                <span>Target (+5s)</span>
                <strong id="target-5s">--</strong>
            </div>
            <div class="target-item">
                <span>Target (+10s)</span>
                <strong id="target-10s">--</strong>
            </div>
        </div>
    </div>
</div>

<script>
    let basePrice = null;
    const THRESHOLD = 375.0;
    let priceHistory = [];
    let timeHistory = [];

    // Formatear Fecha Actual en Español
    function updateDate() {
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        const formattedDate = new Date().toLocaleDateString('es-ES', options);
        // Mayúscula en el primer día
        document.getElementById('current-date-str').innerText = formattedDate.charAt(0).toUpperCase() + formattedDate.slice(1);
    }
    updateDate();

    // Configuración de la Gráfica Rectangular Grande
    const ctx = document.getElementById('priceChart').getContext('2d');
    const priceChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: timeHistory,
            datasets: [{
                data: priceHistory,
                borderColor: '#f0b90b',
                borderWidth: 2,
                pointRadius: 0,
                stepped: true,
                tension: 0
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                x: { 
                    grid: { color: '#1a2028' },
                    ticks: { color: '#848e9c', font: { size: 9 }, maxTicksLimit: 8 } 
                },
                y: { 
                    grid: { color: '#2b313a' }, 
                    ticks: { color: '#848e9c', font: { size: 9 } },
                    position: 'right'
                }
            },
            plugins: { legend: { display: false } }
        }
    });

    // Cargar precio de apertura de la hora actual
    async function fetchExactBasePrice() {
        try {
            const response = await fetch('https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=1h&limit=1');
            const data = await response.json();
            basePrice = parseFloat(data[0][1]);
            document.getElementById('base-price').innerText = `$${basePrice.toLocaleString('en-US', {minimumFractionDigits: 2})}`;
        } catch (e) {
            console.error("Error al obtener precio inicial:", e);
        }
    }

    fetchExactBasePrice();
    setInterval(fetchExactBasePrice, 60000);

    // WebSocket Binance en tiempo real
    const ws = new WebSocket("wss://stream.binance.com:9443/ws/btcusdt@ticker");

    ws.onmessage = (event) => {
        const data = JSON.parse(event.data);
        const price = parseFloat(data.c);
        
        if (basePrice === null) return;

        const delta = price - basePrice;
        const sign = delta >= 0 ? "+" : "";

        document.getElementById('current-price').innerText = `$${price.toLocaleString('en-US', {minimumFractionDigits: 2})}`;
        const deltaElem = document.getElementById('delta-val');
        deltaElem.innerText = `${sign}$${delta.toFixed(2)}`;
        deltaElem.style.color = delta >= 0 ? "#0ecb81" : "#f6465d";

        // Alertas intermitentes en botones rectangulares
        const btnUp = document.getElementById('btn-up');
        const btnDown = document.getElementById('btn-down');

        if (delta >= THRESHOLD) {
            btnUp.classList.add('alert-up-active');
            btnDown.classList.remove('alert-down-active');
        } else if (delta <= -THRESHOLD) {
            btnDown.classList.add('alert-down-active');
            btnUp.classList.remove('alert-up-active');
        } else {
            btnUp.classList.remove('alert-up-active');
            btnDown.classList.remove('alert-down-active');
        }

        // Registrar datos para la gráfica y algoritmos
        const nowTimeStr = new Date().toLocaleTimeString();
        priceHistory.push(price);
        timeHistory.push(nowTimeStr);

        if (priceHistory.length > 90) {
            priceHistory.shift();
            timeHistory.shift();
        }

        // 3 Algoritmos Proyectivos (3s, 5s, 10s)
        if (priceHistory.length > 20) {
            const pNow = price;
            const p5s = priceHistory[priceHistory.length - 6];
            const p10s = priceHistory[priceHistory.length - 15];

            const vel3 = (pNow - p5s) / 5;   // Velocidad reciente a 3s
            const vel5 = (pNow - p10s) / 10; // Velocidad media a 5-10s

            const target3s = pNow + (vel3 * 3);
            const target5s = pNow + (vel5 * 5);
            const target10s = pNow + (vel5 * 10);

            document.getElementById('target-3s').innerText = `$${target3s.toFixed(2)}`;
            document.getElementById('target-5s').innerText = `$${target5s.toFixed(2)}`;
            document.getElementById('target-10s').innerText = `$${target10s.toFixed(2)}`;

            const trendIndicator = document.getElementById('trend-indicator');
            if (vel3 > 0.4) {
                trendIndicator.innerText = "Impulso Alcista 🚀";
                trendIndicator.style.color = "#0ecb81";
            } else if (vel3 < -0.4) {
                trendIndicator.innerText = "Impulso Bajista 🔻";
                trendIndicator.style.color = "#f6465d";
            } else {
                trendIndicator.innerText = "Inercia Estable ⚖️";
                trendIndicator.style.color = "#848e9c";
            }
        }

        priceChart.update();
    };

    // Cuenta Regresiva de la Hora
    function updateTimer() {
        const now = new Date();
        const nextHour = new Date(now.getFullYear(), now.getMonth(), now.getDate(), now.getHours() + 1, 0, 0);
        const diffMs = nextHour - now;
        const totalSecs = Math.floor(diffMs / 1000);
        const minutesLeft = Math.floor(totalSecs / 60);
        const secondsLeft = totalSecs % 60;
        
        document.getElementById('timer').innerText = 
            `${String(minutesLeft).padStart(2, '0')}:${String(secondsLeft).padStart(2, '0')}`;
    }
    setInterval(updateTimer, 1000);
    updateTimer();
</script>

</body>
</html>
